<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marigold Kitchen & Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: stage with left info card | centre device panel (home scene or menu app, floating search dock, order bar) | right category buttons. Four swappable colour themes via data-pal; every colour is a token. */
:root{ /* theme: emerald gold (default) */
  --bg:#07110f; --glow1:rgba(30,120,100,.38); --glow2:rgba(226,182,89,.16); --glow3:rgba(12,70,58,.5);
  --surface:#0d1a17; --surface-2:#12231f; --glass:rgba(13,28,24,.68); --dock:rgba(10,22,19,.88);
  --w:255,255,255; --glass-2:rgba(var(--w),.06); --line:rgba(var(--w),.11);
  --fg:#eef3ec; --muted:#93a8a0; --accent:#e2b659; --acc-rgb:226,182,89; --accent-ink:#1a1405;
  --bar1:#17493c; --bar2:#0f332a; --on-bar:#f1f6f2;
  --g1:#2a8f78; --g2:#0a211c; --on-g:#ffffff;
  --sky1:#06100e; --sky2:#0d2420; --floor:5,12,10; --scene-fg:#f1f6f2; --scene-fg2:#c5d6cf; --vig:rgba(0,0,0,.55); --blend:lighter;
  --o1:226,182,89; --o2:47,160,134; --o3:240,230,200; --o4:20,90,75; --o5:120,200,170; --o6:200,160,70;
  --veg:#46b36a; --nonveg:#e0554a; --ok:#46b36a; --bad:#e0554a;
  --display:'Fraunces',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-pal="plum"]{
  --bg:#0f0a16; --glow1:rgba(150,70,200,.36); --glow2:rgba(255,127,92,.18); --glow3:rgba(70,20,110,.5);
  --surface:#181022; --surface-2:#20152d; --glass:rgba(26,16,38,.7); --dock:rgba(20,12,30,.9);
  --fg:#f4eff8; --muted:#a597b6; --accent:#ff7f5c; --acc-rgb:255,127,92; --accent-ink:#230b04;
  --bar1:#4a2468; --bar2:#341a4c; --on-bar:#f7f1fb; --g1:#8a46c4; --g2:#1a0c28;
  --sky1:#0d0714; --sky2:#240f33; --floor:12,6,18; --scene-fg:#f6f0fa; --scene-fg2:#cdbfdc;
  --o1:255,127,92; --o2:160,90,215; --o3:255,215,190; --o4:100,45,150; --o5:255,170,130; --o6:190,120,240;
}
:root[data-pal="ocean"]{
  --bg:#050c18; --glow1:rgba(40,110,230,.36); --glow2:rgba(90,208,230,.16); --glow3:rgba(15,50,120,.5);
  --surface:#0b1730; --surface-2:#102043; --glass:rgba(11,23,48,.7); --dock:rgba(8,17,36,.9);
  --fg:#eaf1fb; --muted:#8fa4c2; --accent:#5ad0e6; --acc-rgb:90,208,230; --accent-ink:#03161b;
  --bar1:#1a3f8f; --bar2:#122f6c; --on-bar:#f0f5ff; --g1:#2f6fe0; --g2:#071634;
  --sky1:#040a16; --sky2:#0b1d42; --floor:4,10,22; --scene-fg:#eef4ff; --scene-fg2:#bccbe4;
  --o1:90,208,230; --o2:47,111,224; --o3:220,236,255; --o4:22,62,150; --o5:130,185,255; --o6:170,230,245;
}
:root[data-pal="terra"]{
  --bg:#f5eee3; --glow1:rgba(224,150,100,.36); --glow2:rgba(255,214,150,.5); --glow3:rgba(190,110,80,.26);
  --surface:#fffaf1; --surface-2:#f3e9d9; --glass:rgba(255,250,241,.8); --dock:rgba(255,250,241,.94);
  --w:60,40,25; --line:rgba(60,40,25,.14);
  --fg:#2b1d15; --muted:#7b6a5d; --accent:#b8482a; --acc-rgb:184,72,42; --accent-ink:#ffffff;
  --bar1:#c4552f; --bar2:#a8421f; --on-bar:#ffffff; --g1:#d4693f; --g2:#6e2a17; --on-g:#ffffff;
  --sky1:#f7e6d0; --sky2:#efc8a2; --floor:232,200,160; --scene-fg:#2b1d15; --scene-fg2:#5e4a3c; --vig:rgba(150,80,40,.2); --blend:source-over;
  --o1:200,90,55; --o2:232,170,70; --o3:255,240,215; --o4:160,60,40; --o5:220,120,80; --o6:245,190,110;
  --veg:#1f8a45; --nonveg:#c0352b; --ok:#1f8a45; --bad:#c0352b;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(520px 420px at 8% 30%,var(--glow1),transparent 70%),
   radial-gradient(560px 460px at 92% 12%,var(--glow3),transparent 70%),
   radial-gradient(480px 400px at 85% 88%,var(--glow2),transparent 70%),
   radial-gradient(600px 500px at 30% 100%,var(--glow3),transparent 70%),var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted);font-size:13px;margin:0}
a{color:var(--accent)}

/* ===== stage ===== */
#home{min-height:100dvh;display:grid;align-items:center;padding-block:24px}
.stage{width:100%;max-width:1160px;margin-inline:auto;display:grid;grid-template-columns:250px minmax(0,470px) 290px;gap:26px;justify-content:center;align-items:center}
.in-menu .stage{grid-template-columns:250px minmax(0,540px) 290px}
.in-menu .cats{display:none}

.card{border-radius:22px;padding:22px;display:grid;gap:16px;min-width:0}
.logo{display:grid;justify-items:center;gap:6px;text-align:center;padding-bottom:6px}
.ring{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 65%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 72%,#000));color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:48px;box-shadow:0 0 0 5px rgba(var(--acc-rgb),.2),0 10px 30px rgba(0,0,0,.35);flex:none}
.ring.sm{width:40px;height:40px;font-size:21px;box-shadow:0 0 0 3px rgba(var(--acc-rgb),.25)}
.logo b{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.logo span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sep{height:1px;background:var(--line)}
.blk{display:grid;gap:6px}
.blk strong{font-size:15px}
.hrs{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.closed{background:var(--bad)}
.chipbtn{display:inline-flex;align-items:center;gap:7px;width:fit-content;max-width:100%;border:1px solid var(--line);background:var(--glass-2);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--fg);text-decoration:none}
.chipbtn svg.i{width:15px;height:15px}
.socials{display:flex;gap:10px}
.sb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;color:var(--fg)}
.sb svg.i{width:18px;height:18px}

.center{position:relative;height:clamp(420px,calc(100dvh - 48px),640px)}
.in-menu .center{height:clamp(420px,calc(100dvh - 48px),780px)}
.in-menu .nav{display:none}
.in-menu .dock{padding:8px}
.panel,.mpanel{position:absolute;inset:0;border-radius:30px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.panel{background:var(--sky1)}
.in-menu .panel{display:none}
.scene,.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,var(--vig))}
.cap{position:absolute;left:22px;top:22px;right:22px;z-index:2;display:grid;gap:4px;max-width:30ch;color:var(--scene-fg)}
.cap h1{font-size:clamp(26px,5vw,34px);line-height:1.05}
.cap p{margin:0;font-size:13px;color:var(--scene-fg2)}
.mbrand{display:none}

/* dock */
.dock{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;border-radius:26px;padding:10px 12px 6px;display:grid;gap:4px;background:var(--dock);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.ask{display:flex;align-items:center;gap:8px;background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px}
.ask input{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:9px 0;font-size:14px}
.ask input::placeholder{color:var(--muted)}
.go{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav{display:grid;grid-template-columns:repeat(3,1fr);align-items:end}
.nb{background:transparent;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;letter-spacing:.06em;font-weight:700;padding:4px;color:var(--muted)}
.nb.main{color:var(--fg)}
.in-menu .nb.main{color:var(--accent)}
.nb svg.i{width:22px;height:22px}

/* order bar */
.cartbar{position:absolute;left:12px;right:12px;bottom:88px;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:11px 16px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:rise .3s both}
.cartbar .cb-l{display:flex;align-items:center;gap:10px}
.badge{min-width:26px;height:26px;border-radius:13px;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-size:13px;padding:0 7px;font-variant-numeric:tabular-nums}
.cartbar b{font-variant-numeric:tabular-nums}

/* home category buttons */
.cats{display:grid;gap:14px}
.cat{display:flex;align-items:center;gap:16px;border-radius:18px;padding:0 20px;height:74px;text-align:left;color:var(--fg);font-weight:700;letter-spacing:.1em;font-size:14px;text-transform:uppercase;transition:transform .15s,border-color .15s}
.cat svg.i{width:30px;height:30px;color:var(--accent)}
.cat:hover{transform:translateX(-3px);border-color:rgba(var(--acc-rgb),.7)}
.cat .ct{display:grid;gap:1px;flex:1;min-width:0}
.cat .ct small{font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--muted)}
.cat .chev{width:18px;height:18px;color:var(--muted)}

/* ===== menu panel ===== */
.mpanel{display:none;flex-direction:column;background:var(--surface)}
.in-menu .mpanel{display:flex}
.mh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,var(--bar1),var(--bar2));color:var(--on-bar);flex:none}
.mh .nm{font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:17px;flex:1;min-width:0}
.mh .nm small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.04em;opacity:.78}
.hb{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--on-bar) 30%,transparent);background:color-mix(in srgb,var(--on-bar) 12%,transparent);color:var(--on-bar);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.hb svg.i{width:16px;height:16px}
.hb.m{display:inline-flex;padding:7px 10px;min-width:38px;justify-content:center}
#svcB2{display:none}
#menu{position:relative}
.mtabs{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 12px;background:var(--surface-2);flex:none}
.mtabs::-webkit-scrollbar,.mchips::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass-2);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap}
.tab svg.i{width:16px;height:16px}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 12px 4px;align-items:center}
.mchips .lead{display:inline-flex;align-items:center;gap:5px;flex:none;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mchips .lead svg.i{width:15px;height:15px}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(var(--acc-rgb),.12)}
.mscroll{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:84px;scrollbar-width:thin;scrollbar-color:rgba(var(--w),.25) transparent}
.has-cart .mscroll{padding-bottom:150px}

.ban{position:relative;isolation:isolate;overflow:hidden;padding:26px 20px 34px;min-height:170px;display:flex;align-items:flex-end;color:var(--on-g)}
.ban::after{content:"";position:absolute;inset:0;z-index:-2;filter:hue-rotate(var(--hr,0deg));
  background:radial-gradient(circle at 88% 15%,var(--g1),transparent 62%),radial-gradient(circle at 8% 115%,var(--g1),transparent 55%),linear-gradient(135deg,color-mix(in srgb,var(--g1) 30%,var(--g2)),var(--g2))}
.ban::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 14px);pointer-events:none}
.ban .big{position:absolute;z-index:-1;right:-18px;top:-10px;width:170px;height:170px;stroke-width:.9;color:rgba(255,255,255,.2);transform:rotate(-8deg)}
.ban .bt{position:relative;display:grid;gap:6px;max-width:34ch}
.ban h2{font-size:clamp(28px,6vw,36px);line-height:1.05;display:flex;align-items:center;gap:12px}
.ban h2 svg.i{width:30px;height:30px}
.ban p{margin:0;font-size:14px;opacity:.88}
.cnt{width:fit-content;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 10px}

.list{position:relative;margin-top:-20px;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 12px 26px;display:grid;gap:10px}
.sub{font-family:var(--display);font-size:18px;padding:10px 4px 0;display:flex;align-items:center;gap:8px;color:var(--accent)}
.sub svg.i{width:18px;height:18px}
.it{display:grid;grid-template-columns:68px minmax(0,1fr);gap:12px;padding:10px;border-radius:16px;background:var(--glass-2);border:1px solid var(--line);animation:rise .42s both}
.tile{width:68px;height:68px;border-radius:14px;display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;color:var(--on-g)}
.tile::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(135deg,var(--g1),var(--g2));filter:hue-rotate(var(--hr,0deg))}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 1px,transparent 1px 9px)}
.tile svg.i{width:30px;height:30px}
.vd{position:absolute;left:5px;top:5px;width:16px;height:16px;border:2px solid var(--veg);border-radius:4px;background:var(--surface);display:grid;place-items:center}
.vd::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.vd.nv{border-color:var(--nonveg)}.vd.nv::after{background:var(--nonveg)}
.bd{min-width:0}
.it .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.it h3{font-family:var(--body);font-size:16px;font-weight:700;line-height:1.25}
.it p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.tag{font-size:11px;font-weight:500;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.tag.chefT{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ctl{margin-left:auto}
.add{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:5px 18px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.add:hover{background:var(--accent);color:var(--accent-ink)}
.step{display:inline-flex;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:10px;overflow:hidden}
.step button{border:0;background:transparent;color:inherit;width:32px;height:30px;font-weight:700;font-size:17px;line-height:1}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.empty{padding:40px 16px;color:var(--muted);text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== service + theme ===== */
.svc{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;justify-items:end;gap:10px}
.svcb{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;background:var(--bar2);border:1px solid color-mix(in srgb,var(--on-bar) 30%,transparent);color:var(--on-bar);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.svcb svg.i{width:18px;height:18px}
.svcp{border-radius:18px;padding:16px;display:grid;gap:10px;width:min(300px,calc(100vw - 32px))}
.svcp input,.field input{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;width:100%}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.big{width:100%;padding:14px 18px;font-size:15px}
.palb{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:20;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.palp{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:16px;z-index:21;border-radius:18px;padding:14px;display:grid;gap:10px;width:230px}
.sws{display:grid;gap:8px}
.sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--glass-2);border-radius:12px;padding:8px 10px;text-align:left;font-size:13px;font-weight:500}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);flex:none}
.sw[aria-pressed="true"]{border-color:var(--accent);background:rgba(var(--acc-rgb),.12);font-weight:700}

/* ===== sheets ===== */
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.sheet{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:22px;padding:22px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);align-content:start}
.sheet h3{font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row span:first-child{color:var(--muted)}
.row.today{color:var(--accent);font-weight:700}.row.today span:first-child{color:var(--accent)}
.row.total{font-size:17px;font-weight:700;padding-top:8px;border-top:1px solid var(--line)}
.row.total span:first-child{color:var(--fg)}
.copy{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 10px;font-size:12px;margin-left:8px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.crow b{display:block;font-size:15px}
.crow small{color:var(--muted);font-size:12px}
.crow .rt{display:flex;align-items:center;gap:12px}
.crow .lt{font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.field{display:grid;gap:6px}
.pays{display:flex;gap:8px;flex-wrap:wrap}
.pay{border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:7px 14px;font-size:13px}
.pay[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(var(--acc-rgb),.12);font-weight:700}
.done{display:grid;justify-items:center;gap:10px;text-align:center}
.tick{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tick svg.i{width:32px;height:32px;stroke-width:2.2}
.track{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.track li{display:grid;justify-items:center;gap:6px;font-size:11px;color:var(--muted);position:relative}
.track li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1}
.track li::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::before{display:none}
.track li.on{color:var(--fg);font-weight:700}
.track li.on i{background:var(--accent);border-color:var(--accent)}
.track li.on::before{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* ===== dish details ===== */
.it{cursor:pointer;transition:border-color .15s}
.it:hover{border-color:rgba(var(--acc-rgb),.55)}
.sheet.dsheet{padding:0;gap:0;display:flex;flex-direction:column;overflow:hidden;max-height:min(780px,calc(100dvh - 32px));width:min(480px,100%)}
.dbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.dhero{position:relative;isolation:isolate;height:210px;display:grid;place-items:center;overflow:hidden;color:var(--on-g)}
.dhero::after{content:"";position:absolute;inset:0;z-index:-2;filter:hue-rotate(var(--hr,0deg));background:radial-gradient(circle at 50% 42%,var(--g1),transparent 66%),linear-gradient(160deg,color-mix(in srgb,var(--g1) 30%,var(--g2)),var(--g2))}
.dhero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 14px)}
.dhero .big{position:absolute;z-index:-1;width:270px;height:270px;right:-50px;bottom:-70px;stroke-width:.7;color:rgba(255,255,255,.14);transform:rotate(-12deg)}
.dplate{width:112px;height:112px;margin-top:-10px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:0 0 0 12px rgba(255,255,255,.06),0 0 0 26px rgba(255,255,255,.04)}
.dplate svg.i{width:52px;height:52px;stroke-width:1.3}
.dtools{position:absolute;top:12px;right:12px;display:flex;gap:8px}
.dtools .x{background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.28)}
.dtools .x[aria-pressed="true"]{color:#ff6b7d}
.dtools .x[aria-pressed="true"] svg{fill:currentColor}
.dveg{position:absolute;left:16px;top:16px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px}
.dveg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--veg)}
.dveg.nv::before{background:var(--nonveg)}
.dpad{position:relative;margin-top:-24px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px 18px;display:grid;gap:16px}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--accent);font-weight:500}
.dtitle{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dtitle h3{font-size:26px;line-height:1.08}
.pchip{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:8px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ddesc{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.dsec{display:grid;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.dsec .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dsec .hd i{font-style:normal;font-size:12px;color:var(--muted)}
.nut{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.nut div{display:grid;gap:2px;padding:2px 4px;border-left:1px solid var(--line)}
.nut div:first-child{border-left:0}
.nut b{font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.nut b em{font-style:normal;font-family:var(--body);font-size:12px;color:var(--muted);margin-left:2px}
.nut small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nbar{display:flex;height:6px;gap:2px;border-radius:3px;overflow:hidden}
.nbar span{display:block;height:100%}
.prep{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.prep svg.i{width:16px;height:16px}
.als{display:flex;flex-wrap:wrap;gap:8px}
.al{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass-2);border-radius:12px;padding:6px 12px 6px 7px;font-size:13px}
.al i{width:22px;height:22px;border-radius:7px}
.sim{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sim::-webkit-scrollbar{display:none}
.sc{flex:none;width:124px;text-align:left;border:0;background:none;padding:0;display:grid;gap:6px;color:var(--fg)}
.sc .tile{width:100%;height:88px;border-radius:14px}
.sc .tile svg.i{width:34px;height:34px}
.sc b{font-size:13px;line-height:1.25;font-weight:700}
.sc span{font-size:12px;color:var(--accent);font-weight:700}
.dbar{display:flex;gap:12px;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.dbar .step{background:var(--glass-2);color:var(--fg);border:1px solid var(--line)}
.dbar .step button{width:38px;height:40px}
.dbar .btn{flex:1}

/* ===== mobile ===== */
@media (max-width:960px){
  body{padding-bottom:84px}

  .nb{padding:6px 4px;min-height:48px}

  .cat{flex-direction:column;align-items:flex-start;justify-content:center;height:auto;min-height:104px;padding:14px;gap:8px;font-size:13px;position:relative}
  .cat svg.i{width:28px;height:28px}

  #svcB2{display:inline-flex}

  .mh{gap:8px;padding:10px 12px}
  .mh .nm{font-size:16px}
  .mtabs{padding:8px 10px}
  .mchips{padding:10px 10px 2px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  .ov{align-items:end;padding:0}
  .sheet{width:100%;border-radius:22px 22px 0 0;max-height:90dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .sheet.dsheet{padding:0;max-height:92dvh;width:100%}
  .ban{padding:22px 16px 32px;min-height:156px}
  .it{grid-template-columns:60px minmax(0,1fr);gap:10px}

  .ban h2{font-size:26px}
}
@media (max-width:360px){
  .cat{min-height:96px;padding:12px}

}
@media (prefers-reduced-motion:reduce){.it,.cartbar{animation:none}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

function applyI18n(){

function renderStatus(){
  const now=new Date(),d=now.getDay(),h=now.getHours()+now.getMinutes()/60;
  const [o,c]=hoursFor(d),prev=hoursFor((d+6)%7);
  const inToday=h>=o&&h<c,inPrev=h+24<prev[1],isOpen=inToday||inPrev;
  $("#dayname").textContent=t().days[d];
  $("#todayh").textContent=`${fmt(o)} - ${fmt(c)}`;
  const cls="dot"+(isOpen?"":" closed");$("#dot").className=cls;$("#dot2").className=cls;
  $("#open").textContent=isOpen?`${t().open} · ${t().until} ${fmt(inToday?c:prev[1])}`:`${t().closed} · ${t().opens} ${fmt(o)}`;
  $("#open2").textContent=`${isOpen?t().open:t().closed} · ${fmt(o)} - ${fmt(c)}`;
}

function matches(it){
  if(q&&!(it.n.en+" "+it.n.tr+" "+it.d.en).toLowerCase().includes(q))return false;
  if(!mood)return true;

    const list=M.filter(matches);
    const title=mood?t().moods[mood]:`“${q}”`,sub=mood?t().msg[mood]:t().results;
    html=banner(0,"spark",title,sub,list.length);
    if(!list.length)html+=`<div class="list"><p class="empty">${t().none}</p></div>`;
    else{let k=0;html+=`<div class="list">`+CATS.map(c=>{const l=list.filter(i=>i.c===c.id);
      return l.length?`<h3 class="sub">${ico(c.icon)}${c[lang]}</h3>`+l.map(i=>card(i,k++)).join(""):""}).join("")+`</div>`}
  }
  $("#menu").innerHTML=html;
  if(reset)$("#scroll").scrollTop=0;
}
function goTo(id,smooth=true){
  const s=document.getElementById("s-"+id);if(!s)return;
  lock=Date.now()+(smooth?900:0);markTab(id);
  $("#scroll").scrollTo({top:s.offsetTop+$("#menu").offsetTop,behavior:smooth?"smooth":"auto"});
}
function spy(){
  if(!inMenu||searching()||Date.now()<lock)return;
  const sc=$("#scroll"),top=sc.getBoundingClientRect().top;
  const secs=[...document.querySelectorAll(".catsec")];if(!secs.length)return;
  let cur=secs[0].dataset.c;
  secs.forEach(s=>{if(s.getBoundingClientRect().top-top<=100)cur=s.dataset.c});
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-6)cur=secs[secs.length-1].dataset.c;
  if(cur!==cat)markTab(cur);
}
function setMenuOpen(on){
  inMenu=on;$("#home").classList.toggle("in-menu",on);document.body.classList.toggle("menu-open",on);
  if(on){renderTabs();renderChips();renderMenu()}

}
function openMenu(c){cat=c||cat;mood=null;q="";$("#askIn").value="";setMenuOpen(true);goTo(cat,false)}
function parseAsk(v){
  v=v.trim().toLowerCase();mood=null;q="";if(!v)return;
  const kw=t().kw,m=Object.keys(kw).find(k=>kw[k].some(w=>v.includes(w)));

}
function refresh(){renderTabs();renderChips();renderMenu();if(!searching())goTo(cat,false)}
function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>e.hidden=true,3500)}
function toggleLang(){lang=lang==="en"?"tr":"en";applyI18n()}

/* ---- ordering (demo) ---- */
let orderState="cart",lastOrder=null,pay="table",tableVal="",noteVal="",trStep=0,trTimer=null;
const cartCount=()=>{let n=0;cart.forEach(v=>n+=v);return n};
const cartTotal=()=>{let s=0;cart.forEach((v,id)=>s+=M[id].p*v);return s};
function syncCtls(){document.querySelectorAll("[data-ctl]").forEach(e=>{e.innerHTML=ctlHTML(+e.dataset.ctl)})}
function setQty(id,n){
  if(n<=0)cart.delete(id);else cart.set(id,Math.min(n,20));
  document.querySelectorAll(`[data-ctl="${id}"]`).forEach(e=>e.innerHTML=ctlHTML(id));
  updateBar();
  if(!$("#cartOv").hidden&&orderState==="cart")renderCart();
}
function updateBar(){
  const n=cartCount(),show=n>0&&inMenu;
  $("#cartBar").hidden=!show;$("#home").classList.toggle("has-cart",show);
  $("#cbCount").textContent=n;$("#cbTotal").textContent=money(cartTotal());
}
function totalsHTML(total){
  const gst=Math.round(total*5/105);
  return `<div class="blk"><div class="row"><span>${t().subtotal}</span><span>${money(total-gst)}</span></div><div class="row"><span>${t().gst}</span><span>${money(gst)}</span></div><div class="row total"><span>${t().total}</span><span>${money(total)}</span></div></div>`;
}
function renderCart(){
  const sh=$("#cartSheet");
  const head=(title)=>`<h3><span>${title}</span><button class="x" id="cartX" type="button" aria-label="Close">${ico("x").replace('class="i "','class="i" style="width:16px;height:16px"')}</button></h3>`;
  if(orderState==="done"&&lastOrder){
    sh.innerHTML=head(t().placed)+`<div class="done"><div class="tick">${ico("check")}</div>
      <p class="muted">${t().orderNo} <b style="color:var(--fg)">#${lastOrder.no}</b> · ${t().tableNo} <b style="color:var(--fg)">${lastOrder.table}</b></p>
      <ol class="track">${t().steps.map((s,i)=>`<li class="${i<=trStep?"on":""}"><i></i><span>${s}</span></li>`).join("")}</ol></div>
      ${totalsHTML(lastOrder.total)}<p class="muted">${t().demoOrder}</p><button class="btn big" id="moreBtn" type="button">${t().orderMore}</button>`;
    return;
  }
  if(!cart.size){sh.innerHTML=head(t().yourOrder)+`<p class="empty">${t().orderEmpty}</p>`;return}
  const rows=[...cart].map(([id,n])=>{const m=M[id];return `<div class="crow"><div><b>${m.n[lang]}</b><small>${money(m.p)} × ${n}</small></div><div class="rt"><div class="step"><button type="button" data-a="minus" data-id="${id}" aria-label="−">−</button><b>${n}</b><button type="button" data-a="plus" data-id="${id}" aria-label="+">+</button></div><span class="lt">${money(m.p*n)}</span></div></div>`}).join("");
  const pays=[["table",t().payTable],["upi",t().payUpi],["card",t().payCard]].map(([k,l])=>`<button class="pay" type="button" data-pay="${k}" aria-pressed="${pay===k}">${l}</button>`).join("");
  sh.innerHTML=head(t().yourOrder)+`<div>${rows}</div>
    <div class="field"><span class="label">${t().tableNo}</span><input id="cartTable" inputmode="numeric" maxlength="3" value="${tableVal.replace(/"/g,"")}"></div>
    <div class="field"><span class="label">${t().kitchenNote}</span><input id="cartNote" maxlength="120" value="${noteVal.replace(/"/g,"")}"></div>
    <div class="field"><span class="label">${t().payT}</span><div class="pays">${pays}</div></div>
    ${totalsHTML(cartTotal())}
    <button class="btn big" id="placeBtn" type="button">${t().place} · ${money(cartTotal())}</button><p class="muted">${t().demoOrder}</p>`;
}
function openCart(){orderState="cart";if(!tableVal)tableVal=$("#table").value.trim();$("#cartOv").hidden=false;renderCart()}
function closeCart(){$("#cartOv").hidden=true;clearInterval(trTimer);if(orderState==="done"){orderState="cart"}}
function placeOrder(){
  if(!tableVal.trim()){toast(t().tableNeed);const i=$("#cartTable");if(i)i.focus();return}
  lastOrder={no:"MK-"+(1000+Math.floor(Math.random()*9000)),table:tableVal.trim(),total:cartTotal()};
  cart.clear();syncCtls();updateBar();
  orderState="done";trStep=0;renderCart();
  clearInterval(trTimer);trTimer=setInterval(()=>{if(trStep<3){trStep++;if(!$("#cartOv").hidden&&orderState==="done")renderCart()}else clearInterval(trTimer)},3500);
}

/* ---- dish details ---- */
let dId=0,dq=1;const favs=new Set();
const NB={starters:[260,14,18,12],mains:[420,22,38,20],breads:[230,6,38,7],desserts:[320,14,44,6],drinks:[120,3,20,3],mocktails:[110,0,26,0]};
const PB={starters:15,mains:25,breads:10,desserts:8,drinks:5,mocktails:5};
function nutri(i){const b=NB[i.c],f=.85+((i.id*37)%30)/100,r=(v,s=1)=>Math.round(v*f/s)*s,nv=(!i.v&&i.c==="mains")?1.15:1;
  return {cal:r(b[0],5),f:r(b[1]),c:r(b[2]),p:Math.round(b[3]*f*nv)}}
const prepMin=i=>PB[i.c]+(i.id%4)*2;
const AL=[["gluten",/naan|roti|paratha|kulcha|samosa|brownie|jalebi|muthia|batter/,32],["dairy",/paneer|dahi|yoghurt|yogurt|curd|butter|cream|malai|cheese|ghee|milk|kulfi|lassi|shrikhand|rasmalai|rabri|basundi|phirni|khoya|ice cream|chaas|buttermilk|makhani|lababdar/,205],["nuts",/cashew|kaju|pistachio|almond/,28],["eggs",/brownie|egg/,48],["fish",/fish/,215],["shell",/prawn/,340]];
const allergens=i=>{const s=(i.n.en+" "+i.d.en).toLowerCase();return AL.filter(a=>a[1].test(s))};
function renderItem(){
  const i=M[dId],c=CATS.find(x=>x.id===i.c),g=GROUPS.find(x=>x.cats.includes(i.c)),nu=nutri(i),al=allergens(i);
  const e=nu.f*9,cb=nu.c*4,pr=nu.p*4,tot=e+cb+pr||1;
  const i0=M.filter(x=>x.c===i.c).findIndex(x=>x.id===i.id),pool=M.filter(x=>x.c===i.c),sim=pool.map((_,k)=>pool[(i0+1+k)%pool.length]).filter(x=>x.id!==i.id).slice(0,8);
  const inCart=cart.has(i.id);
  $("#itemSheet").innerHTML=`<div class="dbody" id="dBody">
    <div class="dhero" style="--hr:${c.hr}deg">${ico(c.icon,"big")}
      <span class="dveg${i.v?"":" nv"}">${i.v?t().vegL:t().nvL}</span>
      <div class="dtools"><button class="x" id="favB" type="button" aria-label="Favourite" aria-pressed="${favs.has(i.id)}">${ico("heart").replace('class="i "','class="i" style="width:18px;height:18px"')}</button><button class="x" id="itemX" type="button" aria-label="Close">${ico("x").replace('class="i "','class="i" style="width:16px;height:16px"')}</button></div>
      <div class="dplate">${ico(c.icon)}</div></div>
    <div class="dpad">
      <div class="crumb">${g?g[lang]:""} / <b>${c[lang]}</b></div>
      <div class="dtitle"><h3>${i.n[lang]}</h3><span class="pchip">${money(i.p)}</span></div>
      <div class="meta" style="margin:0">${i.t.includes("chef")?`<span class="tag chefT">Chef</span>`:""}${i.t.includes("jain")?`<span class="tag">Jain</span>`:""}${i.t.includes("spicy")?`<span class="tag">${t().moods.spicy}</span>`:""}</div>
      <p class="ddesc">${i.d[lang]}</p>
      <div class="dsec"><div class="hd"><span class="label">${t().nutT}</span><i>${t().perPortion}</i></div>
        <div class="nut"><div><b>${nu.cal}</b><small>${t().calL}</small></div><div><b>${nu.f}<em>g</em></b><small>${t().fatL}</small></div><div><b>${nu.c}<em>g</em></b><small>${t().carbL}</small></div><div><b>${nu.p}<em>g</em></b><small>${t().protL}</small></div></div>
        <div class="nbar"><span style="flex:${e};background:var(--accent)"></span><span style="flex:${cb};background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))"></span><span style="flex:${pr};background:var(--veg)"></span></div>
        <div class="prep">${ico("clock")}${t().prepL}: ${prepMin(i)} ${t().minL}</div>
        <p class="muted" style="font-size:11px">${t().sample}</p></div>
      <div class="dsec"><span class="label">${t().alT}</span>${al.length?`<div class="als">${al.map(a=>`<span class="al"><i style="background:hsl(${a[2]} 70% 55% / .85)"></i>${t()["a_"+a[0]]}</span>`).join("")}</div>`:`<p class="muted">${t().noAl}</p>`}</div>
      <div class="dsec"><span class="label">${t().simT}</span><div class="sim">${sim.map(x=>{const cc=CATS.find(y=>y.id===x.c);return `<button class="sc" type="button" data-open="${x.id}"><span class="tile" style="--hr:${cc.hr}deg">${ico(cc.icon)}</span><b>${x.n[lang]}</b><span>${money(x.p)}</span></button>`}).join("")}</div></div>
    </div></div>
    <div class="dbar"><div class="step" role="group"><button type="button" data-d="minus" aria-label="−">−</button><b id="dq">${dq}</b><button type="button" data-d="plus" aria-label="+">+</button></div><button class="btn" id="dAdd" type="button">${inCart?t().updOrder:t().addTo} · ${money(i.p*dq)}</button></div>`;
}
function openItem(id){dId=id;dq=cart.get(id)||1;renderItem();$("#itemOv").hidden=false}
function closeItem(){$("#itemOv").hidden=true}
$("#itemOv").addEventListener("click",e=>{
  if(e.target.id==="itemOv"||e.target.closest("#itemX"))return closeItem();
  if(e.target.closest("#favB")){favs.has(dId)?favs.delete(dId):favs.add(dId);return $("#favB").setAttribute("aria-pressed",favs.has(dId))}
  const d=e.target.closest("[data-d]");if(d){dq=Math.max(1,Math.min(20,dq+(d.dataset.d==="plus"?1:-1)));$("#dq").textContent=dq;$("#dAdd").textContent=`${cart.has(dId)?t().updOrder:t().addTo} · ${money(M[dId].p*dq)}`;return}
  if(e.target.closest("#dAdd")){setQty(dId,dq);closeItem();return toast(`${M[dId].n[lang]} × ${dq}`)}
  const o=e.target.closest("[data-open]");if(o){openItem(+o.dataset.open);const b=$("#dBody");if(b)b.scrollTop=0}
});

/* ---- events ---- */
$("#cats").addEventListener("click",e=>{const b=e.target.closest(".cat");if(b)openMenu(b.dataset.c)});

  if(searching()){mood=null;q="";$("#askIn").value="";renderTabs();renderChips();renderMenu();goTo(b.dataset.c,false)}else goTo(b.dataset.c,true)});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;mood=mood===b.dataset.m?null:b.dataset.m;q="";$("#askIn").value="";refresh()});
$("#menu").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b){const c=e.target.closest("[data-open]");if(c)openItem(+c.dataset.open);return}const id=+b.dataset.id,n=cart.get(id)||0;setQty(id,b.dataset.a==="minus"?n-1:n+1)});

const openInfo=()=>{$("#ov").hidden=false;$("#closeInfo").focus()};
const closeInfo=()=>{$("#ov").hidden=true};
$("#navInfo").onclick=openInfo;$("#infoB2").onclick=openInfo;$("#langB2").onclick=toggleLang;$("#closeInfo").onclick=closeInfo;
$("#ov").addEventListener("click",e=>{if(e.target.id==="ov")closeInfo()});

$("#cartBar").onclick=openCart;
$("#cartOv").addEventListener("click",e=>{
  if(e.target.id==="cartOv"||e.target.closest("#cartX"))return closeCart();
  const a=e.target.closest("[data-a]");if(a){const id=+a.dataset.id,n=cart.get(id)||0;return setQty(id,a.dataset.a==="minus"?n-1:n+1)}

$("#cartOv").addEventListener("input",e=>{if(e.target.id==="cartTable")tableVal=e.target.value;if(e.target.id==="cartNote")noteVal=e.target.value});

$("#palB").onclick=()=>{const p=$("#palP");p.hidden=!p.hidden;$("#palB").setAttribute("aria-expanded",!p.hidden)};
document.addEventListener("click",e=>{
  const s=e.target.closest(".sw");if(s)setPal(s.dataset.p);

addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(!$("#itemOv").hidden)closeItem();else if(!$("#cartOv").hidden)closeCart();else if(!$("#ov").hidden)closeInfo();else if(!$("#palP").hidden)$("#palB").click();else if(!$("#svcP").hidden)$("#svcB").click()});

$("#copy").onclick=async()=>{const pw=$("#pw").textContent;try{await navigator.clipboard.writeText(pw);toast(t().copied)}catch(e){const r=document.createRange();r.selectNodeContents($("#pw"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};

/* ---- scene: drifting bokeh over a mirrored surface, coloured by the active theme ---- */
let SC={sky1:"#000",sky2:"#111",floor:"0,0,0",blend:"lighter",orbs:["226,182,89"],light:false};
function readScene(){
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  SC={sky1:g("--sky1"),sky2:g("--sky2"),floor:g("--floor"),blend:g("--blend")||"lighter",orbs:[1,2,3,4,5,6].map(i=>g("--o"+i)),light:g("--blend")==="source-over"};
  if(window.__drawScene)window.__drawScene(performance.now());
}
(function(){
  const cv=$("#scene"),ctx=cv.getContext("2d");
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const orbs=Array.from({length:46},()=>({x:rnd(),y:.06+rnd()*.5,r:.03+rnd()*.11,ci:Math.floor(rnd()*6),a:.18+rnd()*.5,s:.15+rnd()*.35,p:rnd()*6.28,dx:.01+rnd()*.03,dy:.008+rnd()*.02}));
  let W=0,H=0,dpr=1;
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  function orb(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(.7,`rgba(${c},${a*.55})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill()}
  function draw(tm){
    if(!W||!H)return;
    const hy=H*.62,k=SC.light?.8:1;
    ctx.globalCompositeOperation="source-over";ctx.fillStyle=SC.sky1;ctx.fillRect(0,0,W,H);
    const sky=ctx.createLinearGradient(0,0,0,hy);sky.addColorStop(0,SC.sky1);sky.addColorStop(1,SC.sky2);ctx.fillStyle=sky;ctx.fillRect(0,0,W,hy);
    ctx.globalCompositeOperation=SC.blend;
    orbs.forEach(o=>{
      const x=(o.x+Math.sin(tm*o.s*.001+o.p)*o.dx)*W,y=(o.y+Math.cos(tm*o.s*.0008+o.p)*o.dy)*hy*1.6,r=o.r*W,c=SC.orbs[o.ci]||SC.orbs[0];
      orb(x,y,r,c,o.a*k);orb(x,2*hy-y,r*.9,c,o.a*.32*k);
    });
    ctx.globalCompositeOperation="source-over";
    const ac=getComputedStyle(document.documentElement).getPropertyValue("--acc-rgb").trim()||"226,182,89";
    const gl=ctx.createLinearGradient(0,hy-40,0,hy+60);gl.addColorStop(0,`rgba(${ac},0)`);gl.addColorStop(.42,`rgba(${ac},.35)`);gl.addColorStop(.5,SC.light?`rgba(255,250,240,.95)`:`rgba(255,240,205,.9)`);gl.addColorStop(.58,`rgba(${ac},.25)`);gl.addColorStop(1,`rgba(${ac},0)`);
    ctx.fillStyle=gl;ctx.fillRect(0,hy-40,W,100);
    const fl=ctx.createLinearGradient(0,hy,0,H);fl.addColorStop(0,`rgba(${SC.floor},.15)`);fl.addColorStop(1,`rgba(${SC.floor},.92)`);ctx.fillStyle=fl;ctx.fillRect(0,hy,W,H-hy);
  }
  window.__drawScene=draw;
  size();
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    let last=0;const loop=tm=>{if(!inMenu&&tm-last>33){draw(tm);last=tm}requestAnimationFrame(loop)};requestAnimationFrame(loop);
  }
  new ResizeObserver(()=>{size();draw(performance.now())}).observe(cv);
})();

try{const p=localStorage.getItem("mk-pal");if(p&&PALS.some(x=>x.id===p))pal=p}catch(e){}
document.documentElement.dataset.pal=pal;
