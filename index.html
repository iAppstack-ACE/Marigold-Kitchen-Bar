<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marigold Kitchen & Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: stage with left info card | centre device panel (home scene or menu app, floating search dock, order bar) | right category buttons. Four swappable colour themes via data-pal; every colour is a token. */
:root{ /* theme: emerald gold (default) */
  --bg:#07110f; --glow1:rgba(30,120,100,.38); --glow2:rgba(226,182,89,.16); --glow3:rgba(12,70,58,.5);
  --surface:#0d1a17; --surface-2:#12231f; --glass:rgba(13,28,24,.68); --dock:rgba(10,22,19,.88);
  --w:255,255,255; --glass-2:rgba(var(--w),.06); --line:rgba(var(--w),.11);
  --fg:#eef3ec; --muted:#93a8a0; --accent:#e2b659; --acc-rgb:226,182,89; --accent-ink:#1a1405;
  --bar1:#17493c; --bar2:#0f332a; --on-bar:#f1f6f2;
  --g1:#2a8f78; --g2:#0a211c; --on-g:#ffffff;
  --sky1:#06100e; --sky2:#0d2420; --floor:5,12,10; --scene-fg:#f1f6f2; --scene-fg2:#c5d6cf; --vig:rgba(0,0,0,.55); --blend:lighter;
  --o1:226,182,89; --o2:47,160,134; --o3:240,230,200; --o4:20,90,75; --o5:120,200,170; --o6:200,160,70;
  --veg:#46b36a; --nonveg:#e0554a; --ok:#46b36a; --bad:#e0554a;
  --display:'Fraunces',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-pal="plum"]{
  --bg:#0f0a16; --glow1:rgba(150,70,200,.36); --glow2:rgba(255,127,92,.18); --glow3:rgba(70,20,110,.5);
  --surface:#181022; --surface-2:#20152d; --glass:rgba(26,16,38,.7); --dock:rgba(20,12,30,.9);
  --fg:#f4eff8; --muted:#a597b6; --accent:#ff7f5c; --acc-rgb:255,127,92; --accent-ink:#230b04;
  --bar1:#4a2468; --bar2:#341a4c; --on-bar:#f7f1fb; --g1:#8a46c4; --g2:#1a0c28;
  --sky1:#0d0714; --sky2:#240f33; --floor:12,6,18; --scene-fg:#f6f0fa; --scene-fg2:#cdbfdc;
  --o1:255,127,92; --o2:160,90,215; --o3:255,215,190; --o4:100,45,150; --o5:255,170,130; --o6:190,120,240;
}
:root[data-pal="ocean"]{
  --bg:#050c18; --glow1:rgba(40,110,230,.36); --glow2:rgba(90,208,230,.16); --glow3:rgba(15,50,120,.5);
  --surface:#0b1730; --surface-2:#102043; --glass:rgba(11,23,48,.7); --dock:rgba(8,17,36,.9);
  --fg:#eaf1fb; --muted:#8fa4c2; --accent:#5ad0e6; --acc-rgb:90,208,230; --accent-ink:#03161b;
  --bar1:#1a3f8f; --bar2:#122f6c; --on-bar:#f0f5ff; --g1:#2f6fe0; --g2:#071634;
  --sky1:#040a16; --sky2:#0b1d42; --floor:4,10,22; --scene-fg:#eef4ff; --scene-fg2:#bccbe4;
  --o1:90,208,230; --o2:47,111,224; --o3:220,236,255; --o4:22,62,150; --o5:130,185,255; --o6:170,230,245;
}
:root[data-pal="terra"]{
  --bg:#f5eee3; --glow1:rgba(224,150,100,.36); --glow2:rgba(255,214,150,.5); --glow3:rgba(190,110,80,.26);
  --surface:#fffaf1; --surface-2:#f3e9d9; --glass:rgba(255,250,241,.8); --dock:rgba(255,250,241,.94);
  --w:60,40,25; --line:rgba(60,40,25,.14);
  --fg:#2b1d15; --muted:#7b6a5d; --accent:#b8482a; --acc-rgb:184,72,42; --accent-ink:#ffffff;
  --bar1:#c4552f; --bar2:#a8421f; --on-bar:#ffffff; --g1:#d4693f; --g2:#6e2a17; --on-g:#ffffff;
  --sky1:#f7e6d0; --sky2:#efc8a2; --floor:232,200,160; --scene-fg:#2b1d15; --scene-fg2:#5e4a3c; --vig:rgba(150,80,40,.2); --blend:source-over;
  --o1:200,90,55; --o2:232,170,70; --o3:255,240,215; --o4:160,60,40; --o5:220,120,80; --o6:245,190,110;
  --veg:#1f8a45; --nonveg:#c0352b; --ok:#1f8a45; --bad:#c0352b;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(520px 420px at 8% 30%,var(--glow1),transparent 70%),
   radial-gradient(560px 460px at 92% 12%,var(--glow3),transparent 70%),
   radial-gradient(480px 400px at 85% 88%,var(--glow2),transparent 70%),
   radial-gradient(600px 500px at 30% 100%,var(--glow3),transparent 70%),var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted);font-size:13px;margin:0}
a{color:var(--accent)}

/* ===== stage ===== */
#home{min-height:100dvh;display:grid;align-items:center;padding-block:24px}
.stage{width:100%;max-width:1160px;margin-inline:auto;display:grid;grid-template-columns:250px minmax(0,470px) 290px;gap:26px;justify-content:center;align-items:center}
.in-menu .stage{grid-template-columns:250px minmax(0,540px) 290px}
.in-menu .cats{display:none}

.card{border-radius:22px;padding:22px;display:grid;gap:16px;min-width:0}
.logo{display:grid;justify-items:center;gap:6px;text-align:center;padding-bottom:6px}
.ring{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 65%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 72%,#000));color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:48px;box-shadow:0 0 0 5px rgba(var(--acc-rgb),.2),0 10px 30px rgba(0,0,0,.35);flex:none}
.ring.sm{width:40px;height:40px;font-size:21px;box-shadow:0 0 0 3px rgba(var(--acc-rgb),.25)}
.logo b{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.logo span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sep{height:1px;background:var(--line)}
.blk{display:grid;gap:6px}
.blk strong{font-size:15px}
.hrs{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.closed{background:var(--bad)}
.chipbtn{display:inline-flex;align-items:center;gap:7px;width:fit-content;max-width:100%;border:1px solid var(--line);background:var(--glass-2);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--fg);text-decoration:none}
.chipbtn svg.i{width:15px;height:15px}
.socials{display:flex;gap:10px}
.sb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;color:var(--fg)}
.sb svg.i{width:18px;height:18px}

.center{position:relative;height:clamp(420px,calc(100dvh - 48px),640px)}
.in-menu .center{height:clamp(420px,calc(100dvh - 48px),780px)}
.in-menu .nav{display:none}
.in-menu .dock{padding:8px}
.panel,.mpanel{position:absolute;inset:0;border-radius:30px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.panel{background:var(--sky1)}
.in-menu .panel{display:none}
.scene,.scene canvas,.scene video{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene video{object-fit:cover;filter:brightness(.62) saturate(.9)}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.26),transparent 75%),radial-gradient(ellipse at center,transparent 45%,var(--vig))}
.cap{position:absolute;left:22px;top:22px;right:22px;z-index:2;display:grid;gap:4px;max-width:30ch;color:var(--scene-fg)}
.cap h1{font-size:clamp(26px,5vw,34px);line-height:1.05}
.cap p{margin:0;font-size:13px;color:var(--scene-fg2)}
.mbrand{display:none}

/* dock */
.dock{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;border-radius:26px;padding:10px 12px 6px;display:grid;gap:4px;background:var(--dock);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.ask{display:flex;align-items:center;gap:8px;background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px}
.ask input{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:9px 0;font-size:14px}
.ask input::placeholder{color:var(--muted)}
.go{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav{display:grid;grid-template-columns:repeat(3,1fr);align-items:end}
.nb{background:transparent;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;letter-spacing:.06em;font-weight:700;padding:4px;color:var(--muted)}
.nb.main{color:var(--fg)}
.in-menu .nb.main{color:var(--accent)}
.nb svg.i{width:22px;height:22px}

/* order bar */
.cartbar{position:absolute;left:12px;right:12px;bottom:88px;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:18px;padding:11px 16px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.35);animation:rise .3s both}
.cartbar .cb-l{display:flex;align-items:center;gap:10px}
.badge{min-width:26px;height:26px;border-radius:13px;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-size:13px;padding:0 7px;font-variant-numeric:tabular-nums}
.cartbar b{font-variant-numeric:tabular-nums}

/* home category buttons */
.cats{display:grid;gap:14px}
.cat{display:flex;align-items:center;gap:16px;border-radius:18px;padding:0 20px;height:74px;text-align:left;color:var(--fg);font-weight:700;letter-spacing:.1em;font-size:14px;text-transform:uppercase;transition:transform .15s,border-color .15s}
.cat svg.i{width:30px;height:30px;color:var(--accent)}
.cat:hover{transform:translateX(-3px);border-color:rgba(var(--acc-rgb),.7)}
.cat .ct{display:grid;gap:1px;flex:1;min-width:0}
.cat .ct small{font-size:11px;letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--muted)}
.cat .chev{width:18px;height:18px;color:var(--muted)}

/* ===== menu panel ===== */
.mpanel{display:none;flex-direction:column;background:var(--surface)}
.in-menu .mpanel{display:flex}
.mh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,var(--bar1),var(--bar2));color:var(--on-bar);flex:none}
.mh .nm{font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:17px;flex:1;min-width:0}
.mh .nm small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.04em;opacity:.78}
.hb{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--on-bar) 30%,transparent);background:color-mix(in srgb,var(--on-bar) 12%,transparent);color:var(--on-bar);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}
.hb svg.i{width:16px;height:16px}
.hb.m{display:inline-flex;padding:7px 10px;min-width:38px;justify-content:center}
#svcB2{display:none}
#menu{position:relative}
.mtabs{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 12px;background:var(--surface-2);flex:none}
.mtabs::-webkit-scrollbar,.mchips::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass-2);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap}
.tab svg.i{width:16px;height:16px}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 12px 4px;align-items:center}
.mchips .lead{display:inline-flex;align-items:center;gap:5px;flex:none;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mchips .lead svg.i{width:15px;height:15px}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(var(--acc-rgb),.12)}
.mscroll{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:84px;scrollbar-width:thin;scrollbar-color:rgba(var(--w),.25) transparent}
.has-cart .mscroll{padding-bottom:150px}

.ban{position:relative;isolation:isolate;overflow:hidden;padding:26px 20px 34px;min-height:170px;display:flex;align-items:flex-end;color:var(--on-g)}
.ban::after{content:"";position:absolute;inset:0;z-index:-2;filter:hue-rotate(var(--hr,0deg));
  background:radial-gradient(circle at 88% 15%,var(--g1),transparent 62%),radial-gradient(circle at 8% 115%,var(--g1),transparent 55%),linear-gradient(135deg,color-mix(in srgb,var(--g1) 30%,var(--g2)),var(--g2))}
.ban::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 14px);pointer-events:none}
.ban .big{position:absolute;z-index:-1;right:-18px;top:-10px;width:170px;height:170px;stroke-width:.9;color:rgba(255,255,255,.2);transform:rotate(-8deg)}
.ban .bt{position:relative;display:grid;gap:6px;max-width:34ch}
.ban h2{font-size:clamp(28px,6vw,36px);line-height:1.05;display:flex;align-items:center;gap:12px}
.ban h2 svg.i{width:30px;height:30px}
.ban p{margin:0;font-size:14px;opacity:.88}
.cnt{width:fit-content;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 10px}

.list{position:relative;margin-top:-20px;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 12px 26px;display:grid;gap:10px}
.sub{font-family:var(--display);font-size:18px;padding:10px 4px 0;display:flex;align-items:center;gap:8px;color:var(--accent)}
.sub svg.i{width:18px;height:18px}
.it{display:grid;grid-template-columns:68px minmax(0,1fr);gap:12px;padding:10px;border-radius:16px;background:var(--glass-2);border:1px solid var(--line);animation:rise .42s both}
.tile{width:68px;height:68px;border-radius:14px;display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;color:var(--on-g)}
.tile::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(135deg,var(--g1),var(--g2));filter:hue-rotate(var(--hr,0deg))}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 1px,transparent 1px 9px)}
.tile svg.i{width:30px;height:30px}
.vd{position:absolute;left:5px;top:5px;width:16px;height:16px;border:2px solid var(--veg);border-radius:4px;background:var(--surface);display:grid;place-items:center}
.vd::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.vd.nv{border-color:var(--nonveg)}.vd.nv::after{background:var(--nonveg)}
.bd{min-width:0}
.it .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.it h3{font-family:var(--body);font-size:16px;font-weight:700;line-height:1.25}
.it p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.tag{font-size:11px;font-weight:500;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.tag.chefT{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ctl{margin-left:auto}
.add{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:10px;padding:5px 18px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.add:hover{background:var(--accent);color:var(--accent-ink)}
.step{display:inline-flex;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:10px;overflow:hidden}
.step button{border:0;background:transparent;color:inherit;width:32px;height:30px;font-weight:700;font-size:17px;line-height:1}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.empty{padding:40px 16px;color:var(--muted);text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== service + theme ===== */
.svc{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;justify-items:end;gap:10px}
.svcb{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;background:var(--bar2);border:1px solid color-mix(in srgb,var(--on-bar) 30%,transparent);color:var(--on-bar);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.svcb svg.i{width:18px;height:18px}
.svcp{border-radius:18px;padding:16px;display:grid;gap:10px;width:min(300px,calc(100vw - 32px))}
.svcp input,.field input{background:var(--glass-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:0;width:100%}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700}
.btn.big{width:100%;padding:14px 18px;font-size:15px}
.palb{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:20;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.palp{position:fixed;top:calc(68px + env(safe-area-inset-top,0px));right:16px;z-index:21;border-radius:18px;padding:14px;display:grid;gap:10px;width:230px}
.sws{display:grid;gap:8px}
.sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--glass-2);border-radius:12px;padding:8px 10px;text-align:left;font-size:13px;font-weight:500}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);flex:none}
.sw[aria-pressed="true"]{border-color:var(--accent);background:rgba(var(--acc-rgb),.12);font-weight:700}

/* ===== sheets ===== */
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.sheet{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:22px;padding:22px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);align-content:start}
.sheet h3{font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row span:first-child{color:var(--muted)}
.row.today{color:var(--accent);font-weight:700}.row.today span:first-child{color:var(--accent)}

}
@media (max-width:640px){

}

}
@media (prefers-reduced-motion:reduce){.it,.cartbar{animation:none}}

/* ===== admin ===== */
:root{--s-new:#e0a93a;--s-prep:#4f8ff0;--s-ready:#46b36a;--s-served:#9a7fe0;--s-paid:#7d8f8a;--s-bad:#e0554a;--c1:var(--accent);--c2:#4fb89c;--c3:#6a8cf0;--c4:#d36fa0;--c5:#e08a4a;--c6:#9a7fe0}

.cn{flex:1;display:grid;min-width:0}.cn small{color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px}
.th{display:flex;justify-content:space-between;align-items:center}.th b{font-family:var(--display);font-size:30px}.tv{font-size:13px;min-height:20px}.tact{display:flex;gap:6px;flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}
.fl{display:grid;gap:6px}.fl.full{grid-column:1/-1}
.hrow2{display:flex;gap:10px;align-items:center;padding:7px 0}.hrow2>span:first-child{width:46px;font-weight:700}.hrow2 input{width:auto}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px}.swrow>div{display:grid}
.chipsr{display:flex;gap:8px;flex-wrap:wrap}
#admModal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:16px}
#admSheet{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:22px;padding:22px;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);align-content:start}
#admSheet h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:18px}
.meta2{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.meta2 b{color:var(--fg)}
.stp{display:flex;gap:6px;flex-wrap:wrap}.sbtn{border:1px solid var(--line);background:var(--glass-2);color:var(--fg);border-radius:99px;padding:6px 12px;font-size:12px}.sbtn[aria-pressed="true"]{background:var(--sc);color:#fff;border-color:var(--sc)}
.tl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}.tl li{display:flex;gap:10px;align-items:center;font-size:13px}.tl i{width:9px;height:9px;border-radius:50%}.tl small{margin-left:auto;color:var(--muted)}
.qrbox{background:#fff;border-radius:16px;padding:16px;width:min(240px,100%);margin:0 auto}.qrbox svg{display:block;width:100%;height:auto}
.linkbox{background:var(--glass-2);border-radius:10px;padding:10px;word-break:break-all;font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted);margin:0}
.ban.prev{min-height:110px;border-radius:14px;margin-top:8px}.ban.prev h2{font-size:22px}
#admToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70}
#admToast[hidden]{display:none}
.admtabs{display:none}
@media(max-width:960px){
  #admApp{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .aside{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;justify-content:space-around}
  .aside .logo2,.aside .sp,.aside .navb span{display:none}.aside .sp{display:none}
  .navb{padding:10px 12px;justify-content:center}.nbdg{position:absolute;top:2px;right:2px;margin:0}
  .amain{height:auto;min-height:0;overflow:hidden}#admApp{height:100dvh}
  #admView{padding:14px}.atop{padding:12px 14px}
  .kpis{grid-template-columns:repeat(2,1fr)}.span8,.span6,.span4{grid-column:span 12}.sgrid{grid-template-columns:1fr}
  .orow{grid-template-columns:1fr auto;grid-template-areas:"a c" "b b" "d d"}.o1{grid-area:a}.o3{grid-area:c;text-align:right}.o2{grid-area:b}.o4{grid-area:d;justify-content:space-between}
  .mhead{display:none}.mrow{grid-template-columns:1fr auto auto;grid-template-areas:"a b c" "d e f"}.mrow .m1{grid-area:a}.mrow .m3{grid-area:b}.mrow .tg{grid-area:c}.mrow .m2{grid-area:d}.mrow .m4{grid-area:e}.mrow .m5{grid-area:f}
  #admModal{align-items:end;padding:0}#admSheet{border-radius:22px 22px 0 0;max-height:92dvh;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .fgrid{grid-template-columns:1fr}.fgrid4{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){.admbtn{bottom:auto;top:12px;left:12px;padding:7px 10px}.admbtn span{display:none}}

function seedOrders(db){
  let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const now=Date.now(),d0=new Date();d0.setHours(0,0,0,0);const start=d0.getTime();
  const pool=[];db.items.forEach(i=>{const w=i.t.includes("chef")?3:i.p<150?2:1;for(let k=0;k<w;k++)pool.push(i)});
  const raw=[];
  for(let off=6;off>=1;off--){const n=14+Math.floor(rnd()*19);for(let k=0;k<n;k++)raw.push(start-off*DAY+(11+rnd()*12)*36e5)}
  const since=(now-start)-9*36e5;
  if(since>0){const n=Math.min(14,Math.max(2,Math.round(since/36e5*2.2)));for(let k=0;k<n;k++)raw.push(start+9*36e5+rnd()*since)}
  raw.sort((a,b)=>a-b);
  const ladder=["new","preparing","ready","served","paid"];
  raw.forEach(ts=>{
    const nl=1+Math.floor(rnd()*3.3),lines=[],seen=new Set();
    for(let k=0;k<nl;k++){const it=pool[Math.floor(rnd()*pool.length)];if(seen.has(it.id))continue;seen.add(it.id);lines.push({id:it.id,c:it.c,n:it.n,p:it.p,q:1+Math.floor(rnd()*2.4)})}
    const total=lines.reduce((s,l)=>s+l.p*l.q,0),age=(now-ts)/6e4;
    let status="paid";
    if(age<45)status=age<5?"new":age<14?"preparing":age<26?"ready":"served";
    else if(rnd()<.05)status="cancelled";
    const log=[["new",ts]];
    if(status==="cancelled")log.push(["cancelled",Math.min(ts+4*6e4,now)]);
    else{const idx=ladder.indexOf(status);for(let s=1;s<=idx;s++)log.push([ladder[s],ts+Math.min(s*9*6e4,(now-ts)*s/(idx+1))])}
    db.orders.push({id:"MK-"+(db.seq++),table:String(1+Math.floor(rnd()*12)),lines,total,note:"",pay:["table","upi","card"][Math.floor(rnd()*3)],status,ts,log,sample:true,manual:true});
  });
  db.orders.reverse();
}

}

    const d=dish.get(l.id)||{n:l.n,q:0,rev:0};d.q+=l.q;d.rev+=l.p*l.q;dish.set(l.id,d);
    cats.set(l.c,(cats.get(l.c)||0)+l.p*l.q);
  }));
  const top=[...dish.values()].sort((a,b)=>b.q-a.q||b.rev-a.rev).slice(0,5);
  const share=[...cats.entries()].sort((a,b)=>b[1]-a[1]);
  return {rev,n,avg,yr,yn,ya,occN,week,top,share,shareTotal:share.reduce((s,x)=>s+x[1],0)};
}
const openCalls=()=>DB.calls.filter(c=>!c.resolved);
function tableState(n){
  const open=DB.orders.filter(o=>String(o.table)===String(n)&&OPEN_ST.includes(o.status));
  const call=DB.calls.some(c=>!c.resolved&&String(c.table)===String(n));
  return {open,call,total:sumT(open)};
}

  if(m.t==="qr"){
    const base=(S.url||"").trim().replace(/#.*$/,"")||(/^https?:/.test(location.href)?location.href.replace(/#.*$/,""):"https://your-restaurant.example/menu");
    const link=`${base}#table${m.n}`,svg=qrSVG(link);
    $("#admSheet").innerHTML=mhead(`${t().qrT} · ${t().tableL} ${m.n}`)+`<div class="qrbox">${svg?svg:`<p class="muted">${t().qrFail}</p>`}</div><p class="muted" style="text-align:center">${t().qrNote}</p>
      <div class="linkbox"><code>${esc(link)}</code></div>${(S.url||"").trim()?"":`<p class="muted">${t().qrSetUrl}</p>`}
      <div class="btnrow"><button class="btn" type="button" data-act="copyLink" data-link="${esc(link)}">${aIco("copy")} ${t().copyLink}</button></div>`;
    admOpenModal();
  }
}
function qrSVG(text){try{if(typeof qrcode!=="function")return "";const qr=qrcode(0,"M");qr.addData(text);qr.make();return qr.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return ""}}

function dishModal(id){
  const it=id?byId(id):null;
  if(!DB.cats.length){noticeModal(t().reqCat);return}
  adm.form={id:it?it.id:null,v:it?it.v:1,t:it?it.t.slice():[],avail:it?it.avail!==false:true,alMan:!!(it&&Array.isArray(it.al)),al:it&&Array.isArray(it.al)?it.al.slice():[]};
  const nut=it&&it.nut?it.nut:{cal:"",f:"",c:"",p:""};
  const f=adm.form;
  adm.modal={t:"dish"};
  $("#admSheet").innerHTML=mhead(it?t().editDish:t().newDish)+`<div class="fgrid">
    ${fl(t().nameEn,`<input id="fNameEn" maxlength="60" value="${esc(it?it.n.en:"")}">`)}${fl(t().nameTr,`<input id="fNameTr" maxlength="60" value="${esc(it?it.n.tr||"":"")}">`)}
    ${fl(t().descEn,`<textarea id="fDescEn" rows="2" maxlength="200">${esc(it?it.d.en||"":"")}</textarea>`,"full")}${fl(t().descTr,`<textarea id="fDescTr" rows="2" maxlength="200">${esc(it?it.d.tr||"":"")}</textarea>`,"full")}
    ${fl(t().priceL,`<input id="fPrice" type="number" min="1" step="1" inputmode="numeric" value="${it?it.p:""}">`)}
    ${fl(t().catL,`<select id="fCat">${DB.cats.map(c=>`<option value="${esc(c.id)}"${(it?it.c:adm.menuC)===c.id?" selected":""}>${esc(cn(c))}</option>`).join("")}</select>`)}</div>
   <div class="blk"><span class="label">${t().dietL}</span><div class="chipsr"><button type="button" class="pay" data-act="dietSet" data-v="1" aria-pressed="${f.v===1}"><i class="vdot"></i> ${t().vegL}</button><button type="button" class="pay" data-act="dietSet" data-v="0" aria-pressed="${f.v===0}"><i class="vdot nv"></i> ${t().nvL}</button></div></div>
   <div class="blk"><span class="label">${t().tagsL}</span><div class="chipsr">${TAGS.map(k=>`<button type="button" class="pay" data-act="tagTog" data-k="${k}" aria-pressed="${f.t.includes(k)}">${t()["tag_"+k]}</button>`).join("")}</div></div>
   <div class="swrow"><b>${t().availL}</b><button class="tg" type="button" data-act="availTog" aria-pressed="${f.avail}" aria-label="${t().availL}"></button></div>
   <div class="blk"><span class="label">${t().nutOpt}</span><p class="muted">${t().nutHint}</p><div class="fgrid4">
     ${fl(t().calL,`<input id="fCal" type="number" min="0" inputmode="numeric" value="${nut.cal}">`)}${fl(t().fatL+" (g)",`<input id="fFat" type="number" min="0" inputmode="numeric" value="${nut.f}">`)}${fl(t().carbL+" (g)",`<input id="fCarb" type="number" min="0" inputmode="numeric" value="${nut.c}">`)}${fl(t().protL+" (g)",`<input id="fProt" type="number" min="0" inputmode="numeric" value="${nut.p}">`)}</div>
     ${fl(t().prepOpt,`<input id="fPrep" type="number" min="0" inputmode="numeric" value="${it&&it.prep!=null?it.prep:""}">`)}</div>
   <div class="blk"><div class="swrow"><b>${t().alMode}</b><button class="tg" type="button" data-act="alMan" aria-pressed="${f.alMan}" aria-label="${t().alMode}"></button></div>
     <p class="muted" id="alAuto"${f.alMan?" hidden":""}>${t().alAuto}</p>
     <div class="chipsr" id="alChips"${f.alMan?"":" hidden"}>${AL.map(a=>`<button type="button" class="pay" data-act="alTog" data-k="${a[0]}" aria-pressed="${f.al.includes(a[0])}">${t()["a_"+a[0]]}</button>`).join("")}</div></div>
   <p class="err" id="fErr" hidden></p>
   <div class="btnrow"><button class="btn2" type="button" data-act="closeModal">${t().cancelB}</button><button class="btn" type="button" data-act="saveDish">${t().save}</button></div>`;
  admOpenModal();
}
function saveDish(){
  const f=adm.form,err=m=>{const e=$("#fErr");e.textContent=m;e.hidden=false},val=id=>$("#"+id).value.trim();
  const en=val("fNameEn"),price=Math.round(+$("#fPrice").value);
  if(!en)return err(t().reqName);
  if(!(price>0))return err(t().reqPrice);
  const nv=["fCal","fFat","fCarb","fProt"].map(id=>$("#"+id).value.trim()),filled=nv.filter(x=>x!=="").length;
  let nut=null;
  if(filled){if(filled<4||nv.some(x=>!/^\d+$/.test(x)))return err(t().nutNum);nut={cal:+nv[0],f:+nv[1],c:+nv[2],p:+nv[3]}}
  const prepV=val("fPrep");
  const base={c:$("#fCat").value,n:{en,tr:val("fNameTr")},d:{en:val("fDescEn"),tr:val("fDescTr")},p:price,v:f.v,t:f.t.slice(),avail:f.avail};
  let it=f.id?byId(f.id):null;
  if(it)Object.assign(it,base);else{it=Object.assign({id:DB.nextItem++},base);DB.items.push(it)}
  if(nut)it.nut=nut;else delete it.nut;
  if(prepV!==""&&/^\d+$/.test(prepV))it.prep=+prepV;else delete it.prep;
  if(f.alMan)it.al=f.al.slice();else delete it.al;
  save();admCloseModal();syncData();admRender();admToast(t().saved);
}
function catModal(id){
  const c=id?catById(id):null;
  adm.form={id:c?c.id:null,icon:c?c.icon:"cloche",visible:c?c.visible:true,hr:c?c.hr:0};
  const f=adm.form;adm.modal={t:"cat"};
  $("#admSheet").innerHTML=mhead(c?t().editCat:t().newCat)+`<div class="fgrid">
    ${fl(t().nameEn,`<input id="cNameEn" maxlength="40" value="${esc(c?c.en:"")}">`)}${fl(t().nameTr,`<input id="cNameTr" maxlength="40" value="${esc(c?c.tr||"":"")}">`)}
    ${fl(t().subEn,`<input id="cSubEn" maxlength="90" value="${esc(c&&c.sub?c.sub.en||"":"")}">`)}${fl(t().subTr,`<input id="cSubTr" maxlength="90" value="${esc(c&&c.sub?c.sub.tr||"":"")}">`)}</div>
   <div class="blk"><span class="label">${t().iconL}</span><div class="chipsr">${ICONS.map(ic=>`<button type="button" class="ibx" data-act="iconPick" data-k="${ic}" aria-pressed="${f.icon===ic}" aria-label="${ic}">${aIco(ic)}</button>`).join("")}</div></div>
   <div class="blk"><span class="label">${t().shadeL}</span><input id="cHr" data-in="shade" type="range" min="-45" max="45" step="1" value="${f.hr}">
     <div class="ban prev" id="cPrev" style="--hr:${f.hr}deg">${aIco(f.icon,"big")}<div class="bt"><h2 id="cPrevT">${aIco(f.icon)}<span>${esc(c?c.en:t().newCat)}</span></h2></div></div></div>
   <div class="swrow"><b>${t().visibleL}</b><button class="tg" type="button" data-act="visTog" aria-pressed="${f.visible}" aria-label="${t().visibleL}"></button></div>
   <p class="err" id="fErr" hidden></p>
   <div class="btnrow"><button class="btn2" type="button" data-act="closeModal">${t().cancelB}</button><button class="btn" type="button" data-act="saveCat">${t().save}</button></div>`;
  admOpenModal();
}
function saveCat(){
  const f=adm.form,en=$("#cNameEn").value.trim();
  if(!en){const e=$("#fErr");e.textContent=t().reqCatName;e.hidden=false;return}
  const data={en,tr:$("#cNameTr").value.trim(),sub:{en:$("#cSubEn").value.trim(),tr:$("#cSubTr").value.trim()},icon:f.icon,hr:f.hr,visible:f.visible};
  if(f.id)Object.assign(catById(f.id),data);
  else{let id=slug(en),k=2;while(catById(id))id=slug(en)+"-"+k++;DB.cats.push(Object.assign({id},data))}
  save();admCloseModal();syncData();admRender();admToast(t().saved);
}
function tableModal(n){
  const tb=n!=null?DB.tables.find(x=>x.n===n):null;
  adm.form={n:tb?tb.n:null};adm.modal={t:"table"};
  const next=Math.max(0,...DB.tables.map(x=>x.n))+1;
  $("#admSheet").innerHTML=mhead(tb?t().editTable:t().addTable)+`<div class="fgrid">${fl(t().tableNo,`<input id="tNum" type="number" min="1" max="999" inputmode="numeric" value="${tb?tb.n:next}">`)}${fl(t().seatsL,`<input id="tSeats" type="number" min="1" max="50" inputmode="numeric" value="${tb?tb.seats:4}">`)}</div>
   <p class="err" id="fErr" hidden></p><div class="btnrow"><button class="btn2" type="button" data-act="closeModal">${t().cancelB}</button><button class="btn" type="button" data-act="saveTable">${t().save}</button></div>`;
  admOpenModal();
}
function saveTable(){
  const n=Math.round(+$("#tNum").value),seats=Math.max(1,Math.round(+$("#tSeats").value)||1),old=adm.form.n;
  if(!(n>0)||DB.tables.some(x=>x.n===n&&x.n!==old)){const e=$("#fErr");e.textContent=t().reqTable;e.hidden=false;return}
  if(old!=null){const tb=DB.tables.find(x=>x.n===old);tb.n=n;tb.seats=seats}else DB.tables.push({n,seats});
  save();admCloseModal();admRender();admToast(t().saved);
}

/* ---------- actions ---------- */
let toastT=null;
function admToast(m){const e=$("#admToast");e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,1800)}
function copyText(txt,okMsg){
  const done=()=>admToast(okMsg);
  try{navigator.clipboard.writeText(txt).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
}
function admAct(act,b){
  const id=b.dataset.id,num=b.dataset.n!=null?+b.dataset.n:null;
  switch(act){
    case"nav":adm.page=b.dataset.p;admRender();$("#admView").scrollTop=0;break;
    case"goOrders":adm.page="orders";adm.ordF=b.dataset.st;adm.ordR="all";adm.ordQ="";admRender();break;
    case"exit":closeAdmin();break;
    case"signout":adm.authed=false;try{sessionStorage.removeItem("mk-admin")}catch(e){}admRender();break;
    case"closeModal":admCloseModal();break;
    /* orders */
    case"ordR":adm.ordR=b.dataset.v;admRender();break;
    case"ordF":adm.ordF=b.dataset.v;admRender();break;
    case"openOrder":adm.modal={t:"order",id,confirm:false};admModalRender();break;
    case"advance":{const o=orderById(id);if(o&&NEXT[o.status])setStatus(o,NEXT[o.status],true);break}
    case"setSt":{const o=orderById(id);if(o&&o.status!==b.dataset.st)setStatus(o,b.dataset.st,true);break}
    case"askCancel":adm.modal.confirm=true;admModalRender();break;
    case"keepOrd":adm.modal.confirm=false;admModalRender();break;
    case"doCancel":{const o=orderById(id);if(o)setStatus(o,"cancelled",true);if(adm.modal)adm.modal.confirm=false;admModalRender();break}
    /* dishes */
    case"addDish":dishModal(null);break;
    case"editDish":dishModal(+id);break;
    case"saveDish":saveDish();break;
    case"toggleAvail":{const i=byId(+id);if(i){i.avail=i.avail===false;save();syncCustomer();admRender()}break}
    case"askDelDish":confirmModal(t().delDishQ,t().delYes,"doDelDish",id);break;
    case"doDelDish":DB.items=DB.items.filter(i=>i.id!==+id);save();syncData();admCloseModal();syncCustomer();admRender();break;
    case"dietSet":adm.form.v=+b.dataset.v;$$("#admSheet [data-act=dietSet]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.v===adm.form.v));break;
    case"tagTog":{const k=b.dataset.k,a=adm.form.t,i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);b.setAttribute("aria-pressed",i<0);break}
    case"availTog":adm.form.avail=!adm.form.avail;b.setAttribute("aria-pressed",adm.form.avail);break;
    case"alMan":adm.form.alMan=!adm.form.alMan;b.setAttribute("aria-pressed",adm.form.alMan);$("#alChips").hidden=!adm.form.alMan;$("#alAuto").hidden=adm.form.alMan;break;
    case"alTog":{const k=b.dataset.k,a=adm.form.al,i=a.indexOf(k);i<0?a.push(k):a.splice(i,1);b.setAttribute("aria-pressed",i<0);break}
    /* categories */
    case"addCat":catModal(null);break;
    case"editCat":catModal(id);break;
    case"saveCat":saveCat();break;
    case"iconPick":adm.form.icon=b.dataset.k;$$("#admSheet [data-act=iconPick]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===adm.form.icon));$("#cPrev .big").outerHTML=aIco(adm.form.icon,"big");$("#cPrevT svg").outerHTML=aIco(adm.form.icon);break;
    case"visTog":adm.form.visible=!adm.form.visible;b.setAttribute("aria-pressed",adm.form.visible);break;
    case"catVis":{const c=catById(id);if(c){c.visible=!c.visible;save();syncCustomer();admRender()}break}
    case"catUp":case"catDown":{const k=DB.cats.findIndex(c=>c.id===id),j=act==="catUp"?k-1:k+1;if(k>=0&&j>=0&&j<DB.cats.length){[DB.cats[k],DB.cats[j]]=[DB.cats[j],DB.cats[k]];save();syncCustomer();admRender()}break}
    case"askDelCat":{const n=DB.items.filter(i=>i.c===id).length;if(n)noticeModal(t().catHasItems);else confirmModal(t().delCatQ,t().delYes,"doDelCat",id);break}
    case"doDelCat":DB.cats=DB.cats.filter(c=>c.id!==id);save();syncData();admCloseModal();syncCustomer();admRender();break;
    /* tables */
    case"addTable":tableModal(null);break;
    case"editTable":tableModal(num);break;
    case"saveTable":saveTable();break;
    case"qr":adm.modal={t:"qr",n:num};admModalRender();break;
    case"copyLink":copyText(b.dataset.link,t().linkCopied);break;
    case"resolveCall":{const c=DB.calls.find(x=>x.id===+id);if(c){c.resolved=true;save();admRender()}break}
    case"closeTable":{
      DB.orders.filter(o=>String(o.table)===String(num)&&OPEN_ST.includes(o.status)).forEach(o=>{o.status="paid";o.log.push(["paid",Date.now()]);o.manual=true});
      DB.calls.forEach(c=>{if(String(c.table)===String(num))c.resolved=true});save();afterOrderChange(null);admRender();break}
    case"askDelTable":{if(tableState(num).open.length)noticeModal(t().tableBusy);else confirmModal(t().tableDelQ,t().delYes,"doDelTable",String(num));break}
    case"doDelTable":DB.tables=DB.tables.filter(x=>x.n!==+id);save();admCloseModal();admRender();break;
    /* settings */
    case"hrOpen":{const h=S.hours[+b.dataset.d];h.x=!h.x;save();renderStatus();renderHours();admRender();break}
    case"forceClosed":S.forceClosed=!S.forceClosed;save();renderStatus();admRender();break;
    case"autoDemo":S.autoDemo=!S.autoDemo;save();admRender();break;
    case"copyData":copyText(JSON.stringify({settings:S,data:DB},null,2),t().sCopied);break;
    case"askReset":confirmModal(t().sResetQ,t().sResetYes,"doReset","x");break;
    case"doReset":{S=clone(DEFAULT_S);DB=seedDB();save();cart.clear();adm.menuC="all";adm.menuQ="";adm.ordF="all";admCloseModal();setPal(S.pal);syncCustomer();admRender();break}
  }
}
$("#adm").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)admAct(b.dataset.act,b)});
$("#adm").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches('.orow[role="button"]'))admAct("openOrder",e.target)});
$("#admModal").addEventListener("click",e=>{if(e.target.id==="admModal")admCloseModal()});

let savedT=null;
function setPath(path,v){const p=path.split(".");let o=S;while(p.length>1)o=o[p.shift()];o[p[0]]=v}
function onField(e){
  const el=e.target;
  if(el.dataset.in==="ordQ"){adm.ordQ=el.value;$("#plist").innerHTML=ordersListH();return}
  if(el.dataset.in==="menuQ"){adm.menuQ=el.value;$("#plist").innerHTML=menuListH();return}
  if(el.dataset.in==="menuC"){adm.menuC=el.value;$("#plist").innerHTML=menuListH();return}
  if(el.dataset.in==="shade"){adm.form.hr=+el.value;$("#cPrev").style.setProperty("--hr",el.value+"deg");return}
  if(el.dataset.h){
    const [d,k]=el.dataset.h.split("."),h=S.hours[+d];if(!el.value)return;
    const [hh,mm]=el.value.split(":").map(Number),v=hh+mm/60;
    if(k==="o"){h.o=v;if(h.c<=h.o)h.c+=24;else if(h.c-24>h.o)h.c-=24}else{h.c=v<=h.o?v+24:v}
    save();renderStatus();renderHours();clearTimeout(savedT);savedT=setTimeout(()=>admRender(),500);return;
  }
  if(el.dataset.set){
    const path=el.dataset.set;let v=el.value;
    if(path==="pin"){if(!/^\d{4,6}$/.test(v)){if(e.type==="change"){admToast(t().pinBad);el.value=S.pin}return}}
    if(path==="gst"){v=Math.max(0,Math.min(28,parseFloat(v)));if(isNaN(v))return}
    setPath(path,v);save();applyS();renderStatus();
    clearTimeout(savedT);savedT=setTimeout(()=>admToast(t().saved),600);
  }
}
$("#adm").addEventListener("input",onField);
$("#adm").addEventListener("change",onField);
$("#pinForm").addEventListener("submit",e=>{
  e.preventDefault();
  if($("#pin").value.trim()===S.pin){adm.authed=true;try{sessionStorage.setItem("mk-admin","1")}catch(x){}$("#pinErr").hidden=true;admRender()}
  else{$("#pinErr").textContent=t().wrongPin;$("#pinErr").hidden=false;$("#pin").select()}
});
$("#admB").onclick=openAdmin;$("#admB2").onclick=openAdmin;
setInterval(()=>{if(!$("#adm").hidden&&adm.authed&&!adm.modal&&!(document.activeElement&&document.activeElement.matches("input,textarea,select")))admRender()},30000);

/* ---------- start ---------- */
load();syncData();
try{const p=localStorage.getItem("mk-pal");pal=(p&&PALS.some(x=>x.id===p))?p:S.pal}catch(e){pal=S.pal}
document.documentElement.dataset.pal=pal;
{const m=/^#table(\d{1,3})$/.exec(location.hash||"");if(m){tableVal=m[1];$("#table").value=m[1]}}
cat=CATS[0]?CATS[0].id:"";
readScene();
applyI18n();
if((location.hash||"")==="#admin")openAdmin();
window.addEventListener("storage",e=>{
  if(e.key!==KEY||!e.newValue)return;
  const before=DB.orders.length;
  try{const o=JSON.parse(e.newValue);if(o&&o.v===2){S=Object.assign(clone(DEFAULT_S),o.S);DB=o.DB}}catch(x){return}
  syncCustomer();if(!$("#adm").hidden){admRender();if(DB.orders.length>before)admToast(t().newOrderToast||"New order")}
});
</script>
